
[pytest]
# Test discovery paths
testpaths = tests

# Test collection patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore production code directories when collecting tests
norecursedirs = .git .tox dist build *.egg .pytest_cache __pycache__ sologit heaven-gui

# Don't collect classes from production code
# This prevents "cannot collect test class 'TestOrchestrator' because it has a __init__ constructor" warnings
python_classes = Test*[!A-Z]* Test*_

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    cli: marks tests as CLI-specific
    tui: marks tests as TUI-specific
    gui: marks tests as GUI-specific
    ai: marks tests that require AI API access
    smoke: marks tests as smoke tests
    unit: marks tests as unit tests
    asyncio: mark a test as asyncio

# Test execution options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=sologit
    --cov-report=term-missing
    --cov-report=html
    --cov-report=json
    -W ignore::pytest.PytestCollectionWarning

# Asyncio mode
asyncio_mode = auto

# Coverage options
[coverage:run]
source = sologit
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

