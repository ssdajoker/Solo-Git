
[package]
name = "heaven-gui"
version = "1.0.0"
description = "Heaven Interface - Desktop GUI for Solo Git workflow manager with AI assistance"
authors = ["Solo Git Contributors"]
license = "MIT"
repository = "https://github.com/ssdajoker/Solo-Git"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "fs-read-dir", "fs-read-file", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
