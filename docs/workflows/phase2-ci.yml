name: Phase 2 CI - Comprehensive Testing

on:
  push:
    branches: [ main, develop, 'phase-2-*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Python Tests (Multi-platform)
  python-tests:
    name: Python Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run pytest with coverage
        run: |
          pytest --cov=sologit --cov-report=xml --cov-report=term tests/

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: ${{ matrix.os }}-python${{ matrix.python-version }}
          name: codecov-umbrella

  # Job 2: Code Quality
  code-quality:
    name: Code Quality (lint, type, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run ruff linter
        run: |
          ruff check sologit/ tests/ || true

      - name: Run black format check
        run: |
          black --check sologit/ tests/

      - name: Run isort import check
        run: |
          isort --check sologit/ tests/

      - name: Run mypy type check
        run: |
          mypy sologit/ --config-file=pyproject.toml || true

  # Job 3: Security Scanning
  security:
    name: Security Scan (bandit, safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run bandit security scan
        run: |
          bandit -r sologit/ -f json -o bandit-report.json || true

      - name: Run safety dependency scan
        run: |
          safety check --json || true

  # Job 4: Pre-Flight Test Suite
  preflight:
    name: Pre-Flight Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Test startup
        run: python3 scripts/preflight/test_startup.py

      - name: Test core features
        run: python3 scripts/preflight/test_core_features.py

      - name: Test error paths
        run: python3 scripts/preflight/test_error_paths.py

      - name: Test persistence
        run: python3 scripts/preflight/test_persistence.py

      - name: Test contracts
        run: python3 scripts/preflight/test_contracts.py

  # Job 5: Coverage Threshold Check
  coverage-check:
    name: Coverage Threshold (≥76%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run coverage check
        run: |
          pytest --cov=sologit --cov-report=term --cov-fail-under=76 tests/

  # Job 6: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run integration tests
        run: |
          pytest tests/ -v -m integration || true

  # Job 7: Documentation Build
  docs-build:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .[dev,test]

      - name: Validate documentation
        run: |
          # Check for broken links, missing files, etc.
          find docs/ -name "*.md" | xargs -I {} python3 -c "print('Checking: {}')"
